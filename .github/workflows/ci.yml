name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify changelog matches package version
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' src/Directory.Build.props | head -n1)"
          if [ -z "${version}" ]; then
            echo "Could not read <Version> from src/Directory.Build.props"
            exit 1
          fi
          if ! grep -qF "## [${version}]" CHANGELOG.md; then
            echo "CHANGELOG.md must include a section heading: ## [${version}]"
            echo "Add release notes when you bump <Version> in src/Directory.Build.props."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Komair.slnx

      - name: Build
        run: dotnet build Komair.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Komair.slnx --no-build -c Release --verbosity normal
