name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DOTNET_VERSION: "8.0.x"
  REPORTGENERATOR_VERSION: "5.4.1"

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Komair.slnx

      - name: Build
        run: dotnet build Komair.slnx --no-restore -c Release

      - name: Test with Coverage
        run: >
          dotnet test Komair.slnx
          --no-build
          -c Release
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory "${{ github.workspace }}/test/.results"

      - name: Install ReportGenerator
        if: success()
        run: dotnet tool install -g dotnet-reportgenerator-globaltool --version ${{ env.REPORTGENERATOR_VERSION }}

      - name: Generate Coverage Report
        if: success()
        env:
          COVERAGE_FONT_IMPORT: '@import url("https://fonts.googleapis.com/css2?family=Syne+Mono&display=swap");'
          COVERAGE_FONT_OVERRIDES: |
            /* Komair: Syne Mono for ReportGenerator HTML (merged after vendor report.css). */

            html,
            body {
              font-family: "Syne Mono", ui-monospace, monospace !important;
            }

            h1,
            .card-group .card .card-header {
              font-family: "Syne Mono", ui-monospace, monospace !important;
            }

            h2,
            h3,
            table,
            th,
            td,
            label,
            a,
            button,
            input,
            select {
              font-family: "Syne Mono", ui-monospace, monospace !important;
            }

            code,
            pre {
              font-family: "Syne Mono", ui-monospace, monospace !important;
            }

            .ct-label {
              font-family: "Syne Mono", ui-monospace, monospace !important;
            }
        run: |
          reportgenerator \
            "-reports:${{ github.workspace }}/test/.results/**/coverage.cobertura.xml" \
            "-targetdir:${{ github.workspace }}/test/.coverage" \
            "-reporttypes:MarkdownSummaryGithub;Html" \
            "-title:Komair code coverage"
          MERGED="${{ github.workspace }}/test/.coverage/report.css.merged"
          {
            printf '%s\n' "$COVERAGE_FONT_IMPORT"
            cat "${{ github.workspace }}/test/.coverage/report.css"
            printf '%s\n' "$COVERAGE_FONT_OVERRIDES"
          } > "$MERGED"
          mv "$MERGED" "${{ github.workspace }}/test/.coverage/report.css"
          if [ -f test/.coverage/SummaryGithub.md ]; then
            cat test/.coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload HTML Coverage Report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: test/.coverage
          if-no-files-found: ignore
